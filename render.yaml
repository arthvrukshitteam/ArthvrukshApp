# Render deploy spec for the MF Analyst backend.
# Push this repo to GitHub → "New +" → "Blueprint" on Render → point at this repo.
services:
  - type: web
    name: mf-analyst-api
    runtime: python
    plan: free                   # upgrade to "starter" ($7/mo) if you want the
                                 # daily NAV refresh cron to run without spin-down
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URL           # paste the SRV string from MongoDB Atlas
        sync: false
      - key: DB_NAME
        value: mf_analyst
      - key: PYTHON_VERSION
        value: "3.11"
